name: AI Markets shared SSO replay
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install redis==8.0.1
      - run: python -m unittest discover -s backend/tests -p test_aimarkets_replay.py
        env:
          RUN_REDIS_INTEGRATION: '1'
